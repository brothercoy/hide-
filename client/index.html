<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Phones: lay the page out at the device's width (not a shrunken 980px desktop page), fill
         the whole screen past any notch, and keep pinch-zoom out of a game that is all taps. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <title>hide @$©!!</title>
    <style>
        @font-face {
            font-family: 'IBMVGA';
            src: url('PxPlus_IBM_VGA_8x16.ttf') format('truetype');
            font-display: block;
        }
        /* Companion pixel fonts — Fusion Pixel 12px monospaced subsets (OFL, see
           FUSION-PIXEL-OFL.txt): kana for the JAPAN chapter, hanzi for CHINA. Used as
           fallbacks after IBMVGA wherever a chapter glyph can appear in canvas text. */
        @font-face {
            font-family: 'PixelJA';
            src: url('fusion-pixel-ja.ttf') format('truetype');
            font-display: block;
        }
        @font-face {
            font-family: 'PixelZH';
            src: url('fusion-pixel-zh.ttf') format('truetype');
            font-display: block;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: black;
            overflow: hidden;
            -webkit-font-smoothing: none;
        }
        #game {
            display: block;
        }
    </style>
</head>
<body>
    <div id="game">
        <canvas id="gameCanvas"></canvas>
    </div>
    <script type="module" src="game.js"></script>
</body>
</html>
